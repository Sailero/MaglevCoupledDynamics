# 演示参数，仅用于接口与数值检查。
# 不是已经验证的高速磁浮稳定性算例。
meta:
  name: demo
  model_version: gap_pid_modal_v1
  parameter_source: demo_not_hs_maglev
  notes: "单悬浮点份额质量；i0 由 F0、kappa、delta_0 计算。"
  coordinate: downward_positive
  units: SI

vehicle:
  m_c: 500.0
  m_m: 250.0
  k_s: 120000.0
  c_s: 3100.0
  g: 9.81

beam:
  L: 24.0
  E: 2.1e+11
  I_b: 0.008
  mu_b: 400.0
  zeta: 0.02
  n_modes: 5
  enabled: true

magnet:
  n_w: 300.0
  A_p: 0.02
  delta_0: 0.008
  I_min: 0.5
  I_max: 60.0
  gap_min: 0.001
  gap_max: 0.025
  delta_floor: 1.0e-6

controller:
  name: gap_pid
  Kp: 6000.0
  Ki: 2000.0
  Kd: 40.0
  tau_d: 0.005
  tau_i: 0.003

motion:
  mode: fixed
  xi: 12.0
  v: 0.0

irregularity:
  type: constant
  value: 0.0

force:
  type: none
  x_f: 12.0

initial:
  mode: equilibrium

integrator:
  method: RK45
  rtol: 1.0e-8
  atol: 1.0e-10
  max_step: 0.001

output:
  dt: 0.001
  t_end: 5.0
  t_start: 0.0
