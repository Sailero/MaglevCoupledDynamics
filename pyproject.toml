[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maglev-sim"
version = "0.2.0"
description = "单点磁浮–梁耦合 DUE 数据生成器（Y、U 张量）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["maglev_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
